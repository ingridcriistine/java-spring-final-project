<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="css/space.css">

    <title>Aqui vai ser o name do espaço</title>
</head>
<body>
    <header>
        <div>
            <h3 class="title" id="nameSpace">-name DO ESPAÇO-</h3>
            <div id="par">
            </div>
        </div>
        <hr>
    </header>
    <main>
        <div class="search">
            <input type="text" class="btn btn-outline-info" id="spaceQuery" placeholder="Search">
            <button class="btn btn-info">🔎</button>
        </div>

        <div class="question" id="fatherDiv">

        </div>
        <button class="btn">Ver Mais</button>
    </main>
    <footer>
        <input type="text" class="btn btn-outline-success" id="question" placeholder="Question">
        <button class="btn btn-success" onclick="postQuestion()">></button>
    </footer>

    <!-- Modal Answer -->
    <div class="modal fade" id="AnswerModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Register Answer</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="text" placeholder="Answer">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Register</button>
            </div>
            </div>
        </div>
    </div>

    <script>
        var IDQUESTION = 0;

        const url = window.location.href;  
        const urlParams = new URLSearchParams(window.location.search);  
        const spaceId = urlParams.get("id");   
        const spaceName = urlParams.get("name"); 

        const par = document.getElementById('par');

        const link = document.createElement('a');
        link.href = `./participants.html?id=${spaceId}&name=${spaceName}`
        link.textContent = "Participants";
                
        par.appendChild(link);
        async function getSpace(){
            document.getElementById("nameSpace").innerHTML = spaceName

            const searchUrl = `http://localhost:8080/questions/${spaceId}?page=1&size=10`;
            const token = sessionStorage.getItem("token");
            
            const header = new Headers();
            header.append("Authorization", "Bearer " + token);
            
            try {
              const response = await fetch(searchUrl, {
                method: 'GET',
                headers: header,
              });
              
              if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.statusText}`);
                console.log("REQUISIÇÃO nao OK")
              } else {
                console.log("REQUISIÇÃO OK")
              }
              
              const questionsDto = await response.json();
              console.log(questionsDto)

              questionsDto.forEach(question =>{ //aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                console.log("Name:", question.text);  
                console.log("ID:", question.idSpace); 
                console.log("ID Question:", question.idQuestion); 

                const details = document.createElement('details');
                
      
                const summary = document.createElement('summary');

              
                const h4 = document.createElement('h4');
                h4.textContent = question.text; 
                summary.appendChild(document.createTextNode(' > ')); 
                summary.appendChild(h4);

                // Criando os botões
                const deleteButton = document.createElement('button');
                deleteButton.classList.add('btn', 'btn-danger');
                deleteButton.textContent = 'Delete';

                const answerButton = document.createElement('button');
                answerButton.classList.add('btn', 'btn-primary');
                answerButton.setAttribute('data-bs-toggle', 'modal');
                answerButton.setAttribute('data-bs-target', '#AnswerModal');
                answerButton.textContent = 'Answer';
                answerButton.id = question.idQuestion;

                answerButton.onclick = function() {
                    console.log(answerButton.id)
                    IDQUESTION = answerButton.id;
                };
              
                summary.appendChild(deleteButton);
                summary.appendChild(answerButton);

                
                details.appendChild(summary);

                
                const div = document.createElement('div');

                const respostas = ['Resposta 1', 'Resposta 2', 'Resposta 3', 'Resposta 4'];

                respostas.forEach(resposta => {
                const p = document.createElement('p');
                p.textContent = resposta;
                div.appendChild(p);
                });

                details.appendChild(div);

                document.getElementById("fatherDiv").appendChild(details)
              })
              
            } catch (error) {
              console.error('Erro ao buscar espaços:', error);
              const errorMessage = document.createElement('p');
              errorMessage.textContent = 'Erro ao buscar espaços. Tente novamente mais tarde.';
              document.body.appendChild(errorMessage);
            }


        }

        async function postQuestion(){
            const question = document.getElementById("question").value;

            const QuestionData = {
                text: question,
                idSpace: spaceId
            };
            const token = sessionStorage.getItem("token");
        
            const header = new Headers();
            header.append("Authorization", "Bearer " + token);
            header.append('Content-Type','application/json');
    
            try {
              const response = await fetch('http://localhost:8080/question', {
                method: 'POST',
                headers: header,
                body: JSON.stringify(QuestionData)
    
              });
              if (!response.ok) {
                  const errorMessage = await response.text();
                  alert(errorMessage);
                  return;
                }
                
                const result = await response.text();
                alert(result);
          }catch(error){
            console.log(error)
          }
        }

        window.onload = async function() {
          await getSpace();
        };
    </script>
   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
