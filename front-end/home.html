<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <title>Spaces</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh;">
    <header class="header">
        <button class="button btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#NewSpace">New Space</button>
    </header>
    <main style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; margin: 10px; gap: 10px">
        <div>
            <input type="text" class="btn btn-outline-info" id="searchInput">
            <input type="submit" class="btn btn-info" onclick="searchSpaces()">
        </div>
        <h2>Your Spaces:</h2>
        <br>
        <div id="main">
        </div>
      </main>
      <div></div>
      
      <div class="modal fade" id="NewSpace" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="a">New Space</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form>
                <div class="mb-3">
                  <label for="name" class="col-form-label">Name:</label>
                  <input type="text" class="form-control" id="name">
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary" onclick="postSpace()">Create Space</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      async function searchSpaces() {
        const search = document.getElementById("searchInput").value;
        const url = search ? `http://localhost:8080/spaces?name=${search}` : "http://localhost:8080/spaces";
        console.log('SEARCH: ', search)

        const token = sessionStorage.getItem("token");
        const header = new Headers();
        header.append("Authorization", "Bearer " + token);
        
        const main = document.getElementById("main")
        try {
          main.innerHTML = '';
          
          const response = await fetch(url, {
            method: 'GET',
            headers: header,
          });
          
          if (!response.ok) {
            throw new Error(`Erro na requisição: ${response.statusText}`);
          } 
          
          const spacesDto = await response.json();
          const spaces = spacesDto.Spaces;
          
          const block = document.getElementById("block");
          
          if (spaces.length > 0) {
            spaces.forEach(space => {
              const div = document.createElement('div');
              div.classList.add('block');
              
              const link = document.createElement('a');
              link.href = `./space.html?id=${space.id}&nome=${encodeURIComponent(space.name)}`
              link.textContent = space.name;
              
              div.appendChild(link);
              
              const button = document.createElement('button');
              button.classList.add('btn', 'btn-danger');
              button.textContent = 'Delete';
              
              button.addEventListener('click', async () => {
                console.log(`Deletando espaço: ${space.name}`);
                const response = await fetch('http://localhost:8080/spaces/' + space.id, {
                  method: 'DELETE',
                  headers: header,
                });
                location.reload()
              });

              if(space.adm){
                div.appendChild(button);
              }

              main.appendChild(div)
            });
            
            
          } else {
            const message = document.createElement('p');
            message.textContent = "Nenhum espaço encontrado.";
            document.body.appendChild(message);
          }
          
          const but = document.createElement('button');
          but.classList.add('btn', 'btn');
          but.textContent = 'Ver Mais';
          
          main.appendChild(but);
          
        } catch (error) {
          console.error('Erro ao buscar espaços:', error);
          const errorMessage = document.createElement('p');
          errorMessage.textContent = 'Erro ao buscar espaços. Tente novamente mais tarde.';
          document.body.appendChild(errorMessage);
        }


      }
      async function postSpace(){

        const spaceName = document.getElementById("name").value;

        const spaceData = {
            name: spaceName,
        };
        const token = sessionStorage.getItem("token");
    
        const header = new Headers();
        header.append("Authorization", "Bearer " + token);
        header.append('Content-Type','application/json');

        try {
          const response = await fetch('http://localhost:8080/spaces', {
            method: 'POST',
            headers: header,
            body: JSON.stringify(spaceData)

          });
          if (!response.ok) {
              const errorMessage = await response.text();
              alert(errorMessage);
              return;
            }
            
            const result = await response.text();
            alert(result);
      }catch(error){
        console.log(error)
      }
      }
      window.onload = async function() {
        await searchSpaces();
      };
      </script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
