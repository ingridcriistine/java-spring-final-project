<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/home.css">
    <title>Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh;">
    <header class="header">
        <div id="div">
          
        </div>
        <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#PermissionModal">New Permission</button>
    </header>
    <main style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; margin: 10px; gap: 10px">


        <form>
            <input type="text" class="btn btn-outline-info" id="searchInput">
            <button type="button" class="btn btn-info" onclick="searchUsers()">Buscar</button>
        </form>
        <h2>Users:</h2>
        <div id="main">
        </div>
        <br>
    </main>
    <div></div>

    <div class="modal fade" id="NewSpace" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5">New Space</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="name" class="col-form-label">Name:</label>
                <input type="text" class="form-control" id="name">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-primary">Create Space</button>
          </div>
        </div>
      </div>
    </div>

     <!-- Modal Permission -->
     <div class="modal fade" id="PermissionModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">New Permission</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input id="id_user" type="number" placeholder="ID User">
                <input id="auth_user" type="number" placeholder="Authorization">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" onclick="createPermission()">Register</button>
            </div>
            </div>
        </div>
    </div>

    <script>
      const url = window.location.href;  
      const urlParams = new URLSearchParams(window.location.search);  
      const spaceId = urlParams.get("id");   
      const spaceName = urlParams.get("name"); 

      const div = document.getElementById("div")
      
      const link = document.createElement('a');
      link.href = `./space.html?id=${spaceId}&name=${spaceName}`
      link.textContent = 'go back';
      
      div.appendChild(link);

      async function createPermission() {
        console.log("create")

        const id_user = document.getElementById("id_user").value;
        const auth_user = true;

        if(document.getElementById("auth_user").value == 0)
          auth_user = false;

        const data = {
          spaceId: 1,
          userId: id_user,
          isAdmin: auth_user
        };

        const token = sessionStorage.getItem("token");
        const header = new Headers();
        header.append("Authorization", "Bearer " + token);

        try {
          const response = await fetch('http://localhost:8080/permission', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify(data)
          });

          if (!response.ok) {
              const errorMessage = await response.text();
              alert(errorMessage);
              return;
          }

          const result = await response.text();

          alert(result);

      } catch (error) {
          alert('Erro ao se conectar ao servidor: ' + error.message);
      }

      }

      async function searchUsers() {
      
        const search = document.getElementById("searchInput").value;
        const url = search ? `http://localhost:8080/user?query=${search}` : "http://localhost:8080/user";

        const token = sessionStorage.getItem("token");
        const header = new Headers();
        header.append("Authorization", "Bearer " + token);
        header.append('Content-Type', 'application/json',);

        try {
          main.innerHTML = '';
            
          const response = await fetch(url, {
            method: 'GET',
            headers: header,
          });
            
          if (!response.ok) {
            throw new Error(`Erro na requisição: ${response.statusText}`);
          } 
            
          const usersDto = await response.json();
          const users = usersDto.Users;
          console.log("Users " + users)
          
          const block = document.getElementById("block");
          
          if (users.length > 0) {
            users.forEach(user => {
              const div = document.createElement('div');
              div.classList.add('block');
              
              const p = document.createElement('p');
              p.textContent = user.name;
              
              div.appendChild(p);

              main.appendChild(div)
            });
            
            
          } else {
            const message = document.createElement('p');
            message.textContent = "Nenhum usuário encontrado.";
            document.body.appendChild(message);
          }
            
          const but = document.createElement('button');
          but.classList.add('btn', 'btn');
          but.textContent = 'Ver Mais';
          
          main.appendChild(but);
          
        } catch (error) {
          console.error('Erro ao buscar usuarios:', error);
          const errorMessage = document.createElement('p');
          errorMessage.textContent = 'Erro ao buscar usuarios. Tente novamente mais tarde.';
          document.body.appendChild(errorMessage);
        }
      }
      window.onload = async function() {
        await searchUsers();
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
